name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

env:
  WRANGLER: wrangler@4.152.0
  WRANGLER_SEND_METRICS: "false"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check

      - name: Upload a new Worker version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-upload.ndjson
        run: |
          npx --yes "$WRANGLER" versions upload --tag "$GITHUB_SHA" --message "$GITHUB_SHA"
          id=$(node -e 'const rows=require("fs").readFileSync(process.argv[1],"utf8").trim().split("\n").map((l)=>JSON.parse(l));const row=rows.find((r)=>r.type==="version-upload");if(!row?.version_id)process.exit(1);console.log(row.version_id)' "$WRANGLER_OUTPUT_FILE_PATH")
          echo "version_id=$id" >> "$GITHUB_OUTPUT"

      - name: Let the upload settle
        run: sleep 30

      - name: Activate the version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes "$WRANGLER" versions deploy "${{ steps.upload.outputs.version_id }}@100%" --message "$GITHUB_SHA" --yes

      # Public routing was provisioned once with the local operator token.
      # Version activation preserves it. Keep domain/DNS writes out of CI:
      # the per-Worker token cannot apply this account's custom-domain setup.

      - name: Check the public site
        run: |
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 --max-time 30 https://photodyssee.ricoslabs.workers.dev/ -o "$RUNNER_TEMP/home.html"
          grep -q Photodyssee "$RUNNER_TEMP/home.html"
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 --max-time 30 https://photodyssee.ricoslabs.workers.dev/gallery/ -o "$RUNNER_TEMP/gallery.html"
          grep -q photo-album "$RUNNER_TEMP/gallery.html"
          for host in photodyssee.com www.photodyssee.com; do
            curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 --max-time 30 "https://$host/gallery/" -o "$RUNNER_TEMP/production-gallery.html"
            grep -q photo-album "$RUNNER_TEMP/production-gallery.html"
          done

      - name: Record the web deploy
        uses: ./.github/actions/record-ship
        with:
          environment: web
          url: https://photodyssee.com
